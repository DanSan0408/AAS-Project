name: Uptime watch

# Checks production from outside every 5 minutes (the app with its database, and the AI service) and tells Telegram when
# one goes down and when it is back. The app's own alerts cannot report that the app, the server or the database is down,
# because they run inside it.
# GitHub's scheduler is best effort (runs can be a few minutes late) and pauses scheduled workflows after 60 days
# without repository activity; re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: uptime-watch
  cancel-in-progress: false

jobs:
  watch:
    name: watch ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: [app, ai]
    steps:
      - name: Check ${{ matrix.target }} and report changes
        env:
          TARGET: ${{ matrix.target }}
          APP_URL: ${{ secrets.IAMS_APP_HEALTH_URL }}
          AI_URL: ${{ secrets.IAMS_AI_HEALTH_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID || secrets.TELEGRAM_DEPLOY_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$TARGET" == "app" ]]; then
            label="IAMS (app and database)"; url="${APP_URL%/}/actuator/health"; expect='"status":"UP"'
          else
            label="IAMS AI service"; url="${AI_URL%/}/health"; expect='"status":"healthy"'
          fi
          if [[ "$url" == "/actuator/health" || "$url" == "/health" ]]; then
            echo "No health URL secret for $TARGET (IAMS_APP_HEALTH_URL / IAMS_AI_HEALTH_URL); nothing to watch."
            exit 0
          fi

          # Three tries 20 seconds apart, so one dropped request is not an outage.
          up=false
          for attempt in 1 2 3; do
            if body=$(curl --fail --silent --max-time 15 "$url") && grep -q "$expect" <<<"$body"; then
              up=true
              break
            fi
            [[ $attempt -lt 3 ]] && sleep 20
          done

          # What this same job concluded last time tells us whether this is a change. A failure means "was down".
          previous=""
          prev_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Uptime watch" --status completed --limit 1 \
            --json databaseId --jq '.[0].databaseId // ""' 2>/dev/null || true)
          if [[ -n "$prev_run" ]]; then
            previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prev_run/jobs" \
              --jq ".jobs[] | select(.name == \"watch $TARGET\") | .conclusion" 2>/dev/null || true)
          fi

          notify() {
            if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
              echo "Telegram is not configured; would have sent: $1"
              return 0
            fi
            curl --fail --silent --show-error --max-time 30 \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$1" > /dev/null
          }

          if [[ "$up" == "true" ]]; then
            echo "$label is up."
            if [[ "$previous" == "failure" ]]; then
              notify "$label is BACK UP (the health check passes again)."$'\n'"$RUN_URL"
            fi
            exit 0
          fi

          echo "$label failed its health check 3 times in a row." >&2
          # Say so at once, then remind once an hour while it stays down.
          if [[ "$previous" != "failure" ]]; then
            notify "$label is DOWN: the health check failed 3 times in a row."$'\n'"$RUN_URL"
          elif [[ "$(date -u +%M)" -lt 5 ]]; then
            notify "$label is STILL DOWN."$'\n'"$RUN_URL"
          fi
          exit 1
