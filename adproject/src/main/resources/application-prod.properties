spring.application.admin.enabled=${SPRING_APPLICATION_ADMIN_ENABLED:true}
spring.jmx.enabled=${SPRING_JMX_ENABLED:true}
management.endpoints.jmx.exposure.include=${MANAGEMENT_ENDPOINTS_JMX_EXPOSURE_INCLUDE:health,info}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
# Which build is running (the CI image tag / git SHA). Shown on /actuator/info and the monitoring page; the deploy
# workflow checks it to be sure the new version, not the old one, is answering.
app.revision=${APP_REVISION:unknown}
management.info.env.enabled=true
info.app.revision=${APP_REVISION:unknown}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/aas_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.from=${SPRING_MAIL_FROM:${spring.mail.username:admin@example.com}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:5000}
spring.mail.properties.mail.smtp.quitwait=${SPRING_MAIL_QUITWAIT:false}

logging.file.path=${LOGGING_FILE_PATH:logs}
logging.file.name=${LOGGING_FILE_NAME:logs/application.log}

spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}
server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:never}

spring.devtools.restart.enabled=false

logging.level.org.thymeleaf=${LOGGING_LEVEL_ORG_THYMELEAF:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER:WARN}

adproject.alerts.enabled=${ADPROJECT_ALERTS_ENABLED:true}
adproject.alerts.recipient-email=${ADPROJECT_ALERTS_RECIPIENT_EMAIL:}
adproject.alerts.threshold.critical-errors=${ADPROJECT_ALERTS_THRESHOLD_CRITICAL_ERRORS:10}
# Telegram alerts (optional). Same bot token as the CI deploy notifications; the chat id falls back to the deploy chat.
adproject.alerts.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
adproject.alerts.telegram.chat-id=${TELEGRAM_ALERT_CHAT_ID:${TELEGRAM_DEPLOY_CHAT_ID:}}
adproject.alerts.environment-label=${ADPROJECT_ENVIRONMENT_LABEL:production}

# Schema guard: make unused legacy NOT NULL columns optional at startup so inserts keep working (never drops data).
app.schema-guard.auto-relax=${APP_SCHEMA_GUARD_AUTO_RELAX:true}

app.public-base-url=${APP_PUBLIC_BASE_URL:https://iams.eduinnovax.com}

# Super Admin Bootstrap (Initial setup only)
app.bootstrap.superadmin.email=${BOOTSTRAP_SUPERADMIN_EMAIL:}
app.bootstrap.superadmin.password=${BOOTSTRAP_SUPERADMIN_PASSWORD:}

# Application Security Keys
app.security.remember-me-key=${APP_SECURITY_REMEMBER_ME_KEY:}
app.security.behind-proxy=${APP_SECURITY_BEHIND_PROXY:false}

# File Upload & Submission Storage
app.upload.submissions-dir=${APP_UPLOAD_SUBMISSIONS_DIR:/app/uploads/submissions}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# AI Microservice Configuration
app.ai-service.url=${AI_SERVICE_URL:http://ai-service:8000}
app.ai-service.secret=${AI_INTERNAL_SECRET:}
app.comment-scan.enabled=${COMMENT_SCAN_ENABLED:true}
# "Sign in with Google" (OpenID Connect). Off unless GOOGLE_CLIENT_ID is set; the login page then has no Google button.
# Only emails already registered in IAMS can sign in this way. The return address defaults to app.public-base-url +
# /login/oauth2/code/google. Setup: GOOGLE_SIGNIN.md.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
