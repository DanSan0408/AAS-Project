<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Super Admin Sidebar</title>
</head>
<body>
    <th:block th:fragment="superadmin_sidebar">
    <button type="button" class="sidebar-toggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
    <div class="sidebar-overlay" aria-hidden="true"></div>
    <div class="sidebar">
        <div class="logo">
            <h2>IAMS</h2>
        </div>
        <div class="user-profile">
            <span sec:authentication="name">Super Admin</span>
        </div>
        <ul class="menu-list">
            <li>
                <a th:href="@{/superadmin/home}">Dashboard</a>
            </li>
            
            <li>
                <a th:href="@{/profile}">My Profile</a>
            </li>
            
            <!-- Super Admin Features -->
            <li class="role-divider">
                <strong class="section-label">Global Management</strong>
            </li>
            <li>
                <a th:href="@{/superadmin/manage-courses}">Manage Courses</a>
            </li>
            <li>
                <a th:href="@{/superadmin/invite-admin}">Invite Admin</a>
            </li>
            
            <!-- Role Switching -->
            <li class="role-divider">
                <strong class="section-label">Switch Role</strong>
            </li>
            <li class="role-switch-link">
                <a th:href="@{/admin/home}">Admin View</a>
            </li>
            <li class="role-switch-link">
                <a th:href="@{/lecturer/home}">Assessor View</a>
            </li>
            
            <!-- Logout -->
            <li class="logout-item">
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </li>
        </ul>
    </div>

    <script th:src="@{/js/sidebar-toggle.js}"></script>
    </th:block>
</body>
</html>
