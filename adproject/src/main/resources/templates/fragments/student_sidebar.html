<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
      <head>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link rel="stylesheet" th:href="@{/css/student_sidebar.css}">
    </head>
<body>
<th:block th:fragment="sidebar">
<button type="button" class="sidebar-toggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
<div class="sidebar-overlay" aria-hidden="true"></div>
<div class="sidebar">
    <div class="logo">
        <h2>IAMS</h2>
    </div>

    <div class="user-profile">
        <span sec:authentication="name"></span>
    </div>

    <ul class="menu-list">
        <li>
            <a th:href="@{/student/home}">
                <i class="fas fa-home"></i> Dashboard
            </a>
        </li>

        <li>
            <a th:href="@{/student/submissions}">
                <i class="fas fa-file-upload"></i> Report Submissions
            </a>
        </li>

        <li>
            <a th:href="@{/student/assessments}">
                <i class="fas fa-tasks"></i> Peer &amp; Self Assessments
            </a>
        </li>

        <li>
            <a th:href="@{/student/comments}">
                <i class="fas fa-comments"></i> My Comments
            </a>
        </li>

        <li>
            <a th:href="@{/profile}">
                <i class="fas fa-user"></i> My Profile
            </a>
        </li>
            
        <li class="logout-item">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn">
                    Logout
                </button>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            </form>
        </li>
    </ul>
</div>

<script th:src="@{/js/sidebar-toggle.js}"></script>
</th:block>
</body>
</html>
