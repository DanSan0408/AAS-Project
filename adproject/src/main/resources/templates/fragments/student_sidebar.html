<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
      <head>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link rel="stylesheet" th:href="@{/css/student_sidebar.css}">
    </head>
<body>
<th:block th:fragment="sidebar">
<button type="button" class="sidebar-toggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
<div class="sidebar-overlay" aria-hidden="true"></div>
<div class="sidebar">
    <div class="logo">
        <h2>IAMS</h2>
    </div>

    <div class="user-profile">
        <span sec:authentication="name"></span>
    </div>

    <ul class="menu-list">
        <li>
            <a th:href="@{/student/home}">
                <i class="fas fa-home"></i> Dashboard
            </a>
        </li>

        <li>
            <a th:href="@{/student/submissions}">
                <i class="fas fa-file-upload"></i> Report Submissions
            </a>
        </li>

        <li>
            <a th:href="@{/student/assessments}">
                <i class="fas fa-tasks"></i> Peer &amp; Self Assessments
            </a>
        </li>

        <li>
            <a th:href="@{/student/comments}">
                <i class="fas fa-comments"></i> My Comments
            </a>
        </li>

        <li>
            <a th:href="@{/profile}">
                <i class="fas fa-user"></i> My Profile
            </a>
        </li>
            
        <li class="logout-item">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn">
                    Logout
                </button>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            </form>
        </li>
    </ul>
</div>

<script>
    (function() {
        var body = document.body;
        var sidebarToggle = document.querySelector('.sidebar-toggle');
        var sidebarOverlay = document.querySelector('.sidebar-overlay');
        var lastScrollY = 0;

        function lockBodyScroll() {
            lastScrollY = window.scrollY || window.pageYOffset || 0;
            body.style.position = 'fixed';
            body.style.top = '-' + lastScrollY + 'px';
            body.style.left = '0';
            body.style.right = '0';
            body.style.width = '100%';
        }

        function unlockBodyScroll() {
            body.style.position = '';
            body.style.top = '';
            body.style.left = '';
            body.style.right = '';
            body.style.width = '';
            window.scrollTo(0, lastScrollY);
        }

        function closeSidebar() {
            body.classList.remove('sidebar-open');
            unlockBodyScroll();
            if (sidebarToggle) {
                sidebarToggle.setAttribute('aria-expanded', 'false');
            }
        }

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', function() {
                var willOpen = !body.classList.contains('sidebar-open');
                body.classList.toggle('sidebar-open');
                if (willOpen) {
                    lockBodyScroll();
                } else {
                    unlockBodyScroll();
                }
                sidebarToggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
            });
        }

        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', closeSidebar);
        }

        window.addEventListener('resize', function() {
            if (window.innerWidth > 1279) {
                closeSidebar();
            }
        });

        // Highlight active link based on current path
        try {
            var currentPath = window.location.pathname;
            var menuLinks = document.querySelectorAll('.sidebar .menu-list a');
            menuLinks.forEach(function(link) {
                var href = link.getAttribute('href');
                link.classList.remove('active');
                if (href === currentPath) {
                    link.classList.add('active');
                } else if (href === '/student/submissions' && 
                    (currentPath.indexOf('/student/submissions') === 0 || 
                     (currentPath.indexOf('/student/assessment/') === 0 && (currentPath.indexOf('/submit') !== -1 || currentPath.indexOf('/submission') !== -1)))) {
                    link.classList.add('active');
                } else if (href === '/student/assessments' && 
                    (currentPath === '/student/assessments' || 
                     (currentPath.indexOf('/student/assessment/') === 0 && currentPath.indexOf('/evaluate') !== -1))) {
                    link.classList.add('active');
                }
            });
        } catch(e) {}
    })();
</script>
</th:block>
</body>
</html>
