<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title th:text="|${errorTitle ?: 'Error'} - IAMS|">Error - IAMS</title>
    <link rel="stylesheet" th:href="@{/css/system-ui.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body data-ui-role="public">
    <main class="error-page">
        <section class="error-card"
                 th:attr="data-severity=${status != null and status >= 500 ? 'server' : (status == 401 or status == 403 ? 'auth' : 'client')}"
                 aria-labelledby="error-title">
            <img class="error-brand" th:src="@{/images/IAMS_logo2.png}" alt="IAMS">

            <p class="error-code" th:text="${status != null ? 'Error ' + status : 'Error'}">Error 500</p>
            <h1 id="error-title" class="error-title" th:text="${errorTitle ?: 'Something went wrong'}">Something went wrong</h1>
            <p class="error-message"
               th:text="${errorMessage ?: 'An unexpected error occurred. Please try again.'}">An unexpected error occurred.</p>

            <div class="error-actions">
                <a th:if="${status == 401}" th:href="@{/login}" class="error-btn error-btn--primary">Sign in</a>
                <a th:unless="${status == 401}" th:href="@{/}" class="error-btn error-btn--primary">Go to dashboard</a>
                <button th:if="${status != null and status >= 500}" type="button" class="error-btn error-btn--secondary"
                        data-error-action="reload">Try again</button>
                <button th:unless="${status != null and status >= 500}" type="button" class="error-btn error-btn--secondary"
                        data-error-action="back">Go back</button>
            </div>

            <div class="error-reference" th:if="${errorId != null and status != null and status >= 500}">
                <span>Reference</span>
                <code id="error-reference" th:text="${errorId}">AB12CD34</code>
                <button type="button" class="error-copy" data-error-action="copy">Copy</button>
            </div>
            <p class="error-support" th:if="${status != null and status >= 500}">
                If this keeps happening, contact
                <a href="mailto:ihsan.rubix@gmail.com">ihsan.rubix@gmail.com</a> and quote the reference.
            </p>
        </section>
    </main>
    <script th:src="@{/js/error-page.js}"></script>
    <script th:src="@{/js/theme-switcher.js}"></script>
</body>
</html>
