<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IAMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/images/IAMS_logo2.png">
    <link rel="stylesheet" href="/css/responsive-patterns.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" th:href="@{/css/system-ui.css}">
</head>
<body data-ui-role="public">
    <div class="auth-container">
        <img th:src="@{/images/IAMS_logo2.png}" alt="IAMS Logo" class="logo" />
        <h3>Login</h3>

        <div th:if="${param.error}" class="alert">
            <p>Invalid email or password. Please try again.</p>
        </div>

        <div th:if="${param.expired}" class="alert" role="status"
             style="background-color: var(--secondary-gold); color: var(--text-charcoal); border-left-color: #E69610;">
            <p>Your session expired. For your security you were signed out after a period of inactivity. Please sign in again.</p>
        </div>

        <div th:if="${param.logout}" class="alert" style="background-color: var(--secondary-gold); color: var(--text-charcoal); border-left-color: #E69610;">
            <p>You have been logged out successfully.</p>
        </div>

        <div th:if="${googleMessage}" class="alert" role="alert">
            <p th:text="${googleMessage}"></p>
        </div>

        <div th:if="${message}" class="success-message">
            <p th:text="${message}"></p>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Email Address</label>
                <input 
                    type="email" 
                    id="username" 
                    name="username" 
                    class="form-control"
                    placeholder="your.email@example.com" 
                    required 
                    autocomplete="email"
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control"
                    placeholder="Enter your password" 
                    required 
                    autocomplete="current-password"
                />
            </div>

            <div class="form-group">
                <label class="inline-flex">
                    <input type="checkbox" name="remember-me" id="remember-me">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" class="auth-btn btn-primary-custom"><i class="fas fa-right-to-bracket"></i> Login</button>
        </form>

        <div th:if="${googleLoginEnabled}" class="google-signin">
            <div class="google-divider"><span>or</span></div>
            <a th:href="@{/oauth2/authorization/google}" class="google-btn">
                <svg class="google-logo" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true" focusable="false">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Sign in with Google</span>
            </a>
        </div>

        <a th:href="@{/forgot_password}" class="forgot-password-link">Forgot Password?</a>
    </div>
    <script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
