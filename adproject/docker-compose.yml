services:
  mysql:
    image: mysql:8.4
    container_name: adproject-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aas_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adproject-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_UPLOAD_SUBMISSIONS_DIR: /app/uploads/submissions
      LOGGING_FILE_PATH: /app/logs
      LOGGING_FILE_NAME: /app/logs/application.log
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aas_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_FROM: ${SPRING_MAIL_FROM}
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD}
      APP_SECURITY_REMEMBER_ME_KEY: ${APP_SECURITY_REMEMBER_ME_KEY}
      APP_SECURITY_BEHIND_PROXY: ${APP_SECURITY_BEHIND_PROXY:-false}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://iams.eduinnovax.com}
      ADPROJECT_ALERTS_ENABLED: ${ADPROJECT_ALERTS_ENABLED:-true}
      ADPROJECT_ALERTS_RECIPIENT_EMAIL: ${ADPROJECT_ALERTS_RECIPIENT_EMAIL}
      ADPROJECT_ALERTS_THRESHOLD_CRITICAL_ERRORS: ${ADPROJECT_ALERTS_THRESHOLD_CRITICAL_ERRORS:-10}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      TELEGRAM_DEPLOY_CHAT_ID: ${TELEGRAM_DEPLOY_CHAT_ID:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET}
      COMMENT_SCAN_ENABLED: ${COMMENT_SCAN_ENABLED:-true}
    ports:
      - "8080:8080"
    volumes:
      - app-logs:/app/logs
      - type: bind
        source: ${APP_UPLOAD_HOST_DIR:-/srv/iams/uploads}
        target: /app/uploads
        bind:
          create_host_path: false

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: adproject-ai
    restart: unless-stopped
    environment:
      # AI_PROVIDER=auto uses DeepSeek when DEEPSEEK_API_KEY is set, otherwise Gemini; either set of variables can be left out.
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-disabled}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-}
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET}
      # Same Telegram bot and chat as the app: the service reports its own errors, AI provider failures and restarts.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      TELEGRAM_DEPLOY_CHAT_ID: ${TELEGRAM_DEPLOY_CHAT_ID:-}
      ADPROJECT_ENVIRONMENT_LABEL: ${ADPROJECT_ENVIRONMENT_LABEL:-production}
    # Not published to the host: only the app reaches the AI service, over the compose network (ai-service:8000).
    # The service refuses to start unless AI_INTERNAL_SECRET is a random value of 16+ characters.
    expose:
      - "8000"

volumes:
  mysql-data:
  app-logs:
